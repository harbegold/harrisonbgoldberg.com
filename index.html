<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harrison B. Goldberg | Mechanical Engineering Student</title>
    <meta name="description" content="Mechanical Engineering student building robotic systems and production-ready products through CAD, embedded controls, simulation, and additive manufacturing." />
    <link rel="icon" type="image/png" href="/harrison-cover.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-primary: #fbfbfd;
        --bg-secondary: #f5f5f7;
        --text-primary: #1d1d1f;
        --text-secondary: #6e6e73;
        --accent: #007aff;
        --border: rgba(0, 0, 0, 0.08);
      }
      html {
        scroll-padding-top: 5rem;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        scroll-behavior: smooth;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }
      /* A definite height avoids Safari collapsing an auto-height flex dialog. */
      .project-dialog {
        inset: 0;
        width: calc(100% - 2rem);
        max-width: 56rem;
        height: calc(100vh - 2rem);
        height: calc(100dvh - 2rem);
        max-height: calc(100vh - 2rem);
        max-height: calc(100dvh - 2rem);
      }
      .project-dialog-content {
        box-sizing: border-box;
        height: 100%;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        overflow-wrap: anywhere;
        scroll-padding-top: 4rem;
      }
      .chat-widget {
        right: max(1rem, env(safe-area-inset-right));
        bottom: max(1rem, env(safe-area-inset-bottom));
      }
      .chat-panel {
        width: min(24rem, calc(100vw - 2rem));
        height: min(28.125rem, calc(100vh - 6rem));
        height: min(28.125rem, calc(100dvh - 6rem));
      }
      #mobile-navigation {
        max-height: calc(100vh - 3.5rem);
        max-height: calc(100dvh - 3.5rem);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      @media (prefers-reduced-motion: reduce) {
        .fade-in-up { animation: none; }
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      .glass {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .glass-soft {
        background: rgba(0, 0, 0, 0.04);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border: 1px solid rgba(0, 0, 0, 0.06);
      }
      .apple-gradient {
        background: linear-gradient(180deg, #1d1d1f 0%, #6e6e73 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .feature-card {
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .feature-card:hover {
        background: rgba(0, 0, 0, 0.05);
        transform: translateY(-2px);
      }
      ::selection {
        background-color: #007aff;
        color: #fff;
      }
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-primary);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.3);
      }
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in-up {
        animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
