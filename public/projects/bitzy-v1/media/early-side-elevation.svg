<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="700" fill="#FCFCFB"/>
  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">KineArm — Zero-Pose Side Elevation (Side 1: +X right, +Z up)</text>
  <text x="320" y="56" text-anchor="middle" font-size="13" fill="#666">All joints 0° → arm straight up → gripper tip at (0, 0, 729) mm. Lengths axis-to-axis.</text>

  <!-- ground + base plate -->
  <line x1="120" y1="620" x2="470" y2="620" stroke="#bbb" stroke-width="1.5"/>
  <rect x="150" y="620" width="120" height="13" fill="#3a3a3a"/>
  <text x="210" y="652" text-anchor="middle" font-size="11" fill="#666">base plate (≥150×150 mm)</text>

  <!-- arm segments (x = 210) -->
  <line x1="210" y1="620" x2="210" y2="462" stroke="#92400E" stroke-width="16" stroke-linecap="round"/>
  <line x1="210" y1="462" x2="210" y2="338" stroke="#10B981" stroke-width="13" stroke-linecap="round"/>
  <line x1="210" y1="338" x2="210" y2="214" stroke="#F97316" stroke-width="13" stroke-linecap="round"/>
  <line x1="210" y1="214" x2="210" y2="168" stroke="#EAB308" stroke-width="9"  stroke-linecap="round"/>

  <!-- J4 marker on forearm -->
  <circle cx="210" cy="276" r="6" fill="#EF4444" stroke="#111" stroke-width="1.2"/>
  <text x="192" y="280" text-anchor="end" font-size="12" fill="#EF4444" font-weight="bold">J4</text>

  <!-- joint dots -->
  <circle cx="210" cy="620" r="10" fill="#92400E" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="462" r="11" fill="#10B981" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="338" r="10" fill="#F97316" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="214" r="9"  fill="#EAB308" stroke="#111" stroke-width="1.5"/>
  <circle cx="210" cy="168" r="8"  fill="#38BDF8" stroke="#111" stroke-width="1.5"/>

  <!-- joint labels (left) -->
  <text x="185" y="624" text-anchor="end" font-size="13" font-weight="bold" fill="#92400E">J1 base yaw</text>
  <text x="185" y="466" text-anchor="end" font-size="13" font-weight="bold" fill="#10B981">J2 shoulder</text>
  <text x="185" y="342" text-anchor="end" font-size="13" font-weight="bold" fill="#F97316">J3 elbow</text>
  <text x="185" y="210" text-anchor="end" font-size="13" font-weight="bold" fill="#B8860B">J5 wrist</text>
  <text x="185" y="164" text-anchor="end" font-size="13" font-weight="bold" fill="#0EA5E9">J6 gripper tip</text>

  <!-- dimension lines (right) -->
  <g stroke="#333" stroke-width="1">
    <line x1="330" y1="620" x2="330" y2="462"/>
    <line x1="325" y1="620" x2="335" y2="620"/><line x1="325" y1="462" x2="335" y2="462"/>
    <line x1="330" y1="462" x2="330" y2="338"/>
    <line x1="325" y1="338" x2="335" y2="338"/>
    <line x1="330" y1="338" x2="330" y2="214"/>
    <line x1="325" y1="214" x2="335" y2="214"/>
    <line x1="330" y1="214" x2="330" y2="168"/>
    <line x1="325" y1="168" x2="335" y2="168"/>
  </g>
  <text x="342" y="545" font-size="13" fill="#111">d₁ = 254 mm</text>
  <text x="342" y="404" font-size="13" fill="#111">L1 = 200 mm</text>
  <text x="342" y="280" font-size="13" fill="#111">L2 = 200 mm</text>
  <text x="342" y="195" font-size="13" fill="#111">d₆ = 75 mm</text>

  <!-- total -->
  <g stroke="#888" stroke-width="1">
    <line x1="470" y1="620" x2="470" y2="168"/>
    <line x1="465" y1="620" x2="475" y2="620"/><line x1="465" y1="168" x2="475" y2="168"/>
  </g>
  <text x="482" y="398" font-size="14" font-weight="bold" fill="#111">729 mm</text>
  <text x="482" y="416" font-size="11" fill="#666">base → tip</text>

  <!-- axis arrows -->
  <g stroke="#999" stroke-width="1.5" fill="#999">
    <line x1="90" y1="640" x2="90" y2="590"/><polygon points="86,594 94,594 90,584"/>
    <text x="98" y="596" font-size="12" fill="#777">+Z</text>
    <line x1="90" y1="640" x2="140" y2="640"/><polygon points="136,636 136,644 146,640"/>
    <text x="124" y="662" font-size="12" fill="#777">+X</text>
  </g>
</svg>
