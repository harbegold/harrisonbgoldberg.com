<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Bitzy decision pipeline with a local 27B model on an RTX 4090</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.5; rx: 12; }
      .model { fill: #eef4ff; stroke: #84adff; }
      .guard { fill: #ecfdf3; stroke: #6ce9a6; }
      .data { fill: #fffaeb; stroke: #fec84b; }
      .title { font-size: 17px; font-weight: 600; fill: #101828; }
      .text { font-size: 13.5px; fill: #344054; }
      .small { font-size: 12.5px; fill: #667085; }
      .flow { stroke: #475467; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #98a2b3; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#f9fafb"/>

  <rect class="box" x="30" y="40" width="200" height="150"/>
  <text class="title" x="50" y="72">1 · Observe</text>
  <text class="text" x="50" y="100">Camera frame</text>
  <text class="text" x="50" y="122">Measured markers and</text>
  <text class="text" x="50" y="142">objects (table frame)</text>
  <text class="text" x="50" y="164">Tip + controller state</text>

  <rect class="box model" x="270" y="40" width="240" height="150"/>
  <text class="title" x="290" y="72">2 · Propose</text>
  <text class="text" x="290" y="100">Qwen3.8-27B, 4-bit</text>
  <text class="text" x="290" y="122">RTX 4090: 55 of 64 blocks</text>
  <text class="text" x="290" y="144">Work-area image, ids drawn</text>
  <text class="text" x="290" y="166">→ one JSON intent</text>

  <rect class="box guard" x="550" y="40" width="200" height="150"/>
  <text class="title" x="570" y="72">3 · Validate</text>
  <text class="text" x="570" y="100">Allowlist + ranges</text>
  <text class="text" x="570" y="122">Only measured ids</text>
  <text class="text" x="570" y="144">Reach checks</text>
  <text class="text" x="570" y="166">Stale: STOP, camera, arm</text>

  <rect class="box guard" x="790" y="40" width="180" height="150"/>
  <text class="title" x="810" y="72">4 · Act</text>
  <text class="text" x="810" y="100">Only if allowed</text>
  <text class="text" x="810" y="122">Guarded tasks: IK,</text>
  <text class="text" x="810" y="144">limits, watchdog</text>
  <text class="text" x="810" y="166">STOP always wins</text>

  <rect class="box" x="1010" y="40" width="160" height="150"/>
  <text class="title" x="1030" y="72">5 · Measure</text>
  <text class="text" x="1030" y="100">Outcome vs claim</text>
  <text class="text" x="1030" y="122">Human label kept</text>
  <text class="text" x="1030" y="144">separately</text>

  <path class="flow" d="M230,115 L268,115"/>
  <path class="flow" d="M510,115 L548,115"/>
  <path class="flow" d="M750,115 L788,115"/>
  <path class="flow" d="M970,115 L1008,115"/>

  <rect class="box model" x="270" y="250" width="240" height="110"/>
  <text class="title" x="290" y="282">Live neural activity</text>
  <text class="text" x="290" y="308">Forward-hook values for this</text>
  <text class="text" x="290" y="328">decision only; frozen at the end</text>
  <text class="small" x="290" y="348">sampled; checked vs saved tensors</text>
  <path class="dash" d="M390,190 L390,248"/>

  <rect class="box data" x="790" y="250" width="380" height="110"/>
  <text class="title" x="810" y="282">Training data</text>
  <text class="text" x="810" y="308">Real decisions filtered by outcome + labels</text>
  <text class="text" x="810" y="328">3,000 randomised simulator examples</text>
  <text class="small" x="810" y="348">every label passes Bitzy's validator</text>
  <path class="dash" d="M1090,190 L1090,248"/>

  <rect class="box data" x="790" y="400" width="380" height="95"/>
  <text class="title" x="810" y="432">Student model (same 4090)</text>
  <text class="text" x="810" y="458">Qwen3.5-2B / 0.8B + LoRA · seconds per answer</text>
  <text class="small" x="810" y="480">shadow mode until it passes the gate</text>
  <path class="flow" d="M980,360 L980,398"/>
  <path class="dash" d="M790,447 L520,447 L520,190"/>
  <text class="small" x="540" y="440">later: answers first, 27B as fallback</text>
</svg>
