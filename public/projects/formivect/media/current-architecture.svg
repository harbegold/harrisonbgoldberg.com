<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-label="Current preview / native execution"><rect width="800" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#102b37"><text x="38" y="45" font-size="25" font-weight="700">Current preview / native execution</text><rect x="38" y="85" width="724" height="88" rx="12" fill="#f6f8f9" stroke="#d9e2e7"/><text x="62" y="118" font-size="22" font-weight="700">Project and build</text><text x="62" y="146" font-size="16" fill="#526370">Bound document, local history, request and permissions</text><path d="M400 173v20" stroke="#075f6c" stroke-width="2"/><rect x="38" y="193" width="724" height="88" rx="12" fill="#f6f8f9" stroke="#d9e2e7"/><text x="62" y="226" font-size="22" font-weight="700">Selected agent or external client</text><text x="62" y="254" font-size="16" fill="#526370">Plans and sends typed tools; checks the steering inbox</text><path d="M400 281v20" stroke="#075f6c" stroke-width="2"/><rect x="38" y="301" width="724" height="88" rx="12" fill="#f6f8f9" stroke="#d9e2e7"/><text x="62" y="334" font-size="22" font-weight="700">MCP / local bridge</text><text x="62" y="362" font-size="16" fill="#526370">Authenticated connection and asynchronous job results</text><path d="M400 389v20" stroke="#075f6c" stroke-width="2"/><rect x="38" y="409" width="724" height="88" rx="12" fill="#f6f8f9" stroke="#d9e2e7"/><text x="62" y="442" font-size="22" font-weight="700">Fair project queue</text><text x="62" y="470" font-size="16" fill="#526370">One native job at a time; interactive-command guard</text><path d="M400 497v20" stroke="#075f6c" stroke-width="2"/><rect x="38" y="517" width="724" height="88" rx="12" fill="#f6f8f9" stroke="#d9e2e7"/><text x="62" y="550" font-size="22" font-weight="700">Fusion native API</text><text x="62" y="578" font-size="16" fill="#526370">Geometry, parameter edits, images and exports</text></g></svg>